# ============================================================================
# THE LIVE LIBRECHAT CONFIG — lives IN THE FORK as of Aug 17 2026 (Part 72).
#
# WHY IT MOVED: CONFIG_PATH used to point at
#   https://raw.githubusercontent.com/kademurdock/librechat.yaml/.../librechat.yaml
# so EVERY boot re-downloaded this file from GitHub. With Railway app-sleep on,
# the service woke dozens of times a day and that fetch sometimes FAILED
# ("Failed to fetch the remote config file") -- a config-less boot has NO custom
# endpoints, so the very next message answered
#   { "type": "endpoint_models_not_loaded", "info": "OpenRouter" }.
# Aug 17 2026: 79 sleep/wake cycles in ~24h, and Kade got that error in the face
# while every pot was funded (Moonshot answered a live paid k3 turn the same hour).
#
# NOW: this file ships inside the image. Cold boots never touch the network for
# config, so app-sleep is safe again -- Kade's July condition was "on, but only
# if wake is fast," and a wake no longer depends on GitHub being reachable.
#
# FILENAME NOTE: deliberately NOT "librechat.yaml" -- the fork's .dockerignore
# ignores `librechat*` (line 12), so a file by that name would never reach the
# image. CONFIG_PATH=/app/kade-config.yaml on the LibreChat Railway service.
#
# EDITING FROM NOW ON: edit THIS file, push to the `kade` branch, and it
# auto-deploys with the fork. The old repo kademurdock/librechat.yaml is FROZEN
# for config purposes (its PLATFORM_STATUS.md and VOICE_CATALOG.* are untouched
# and still live). The old "yaml needs a MANUAL serviceInstanceDeployV2" chore
# is over.
# Provenance: copied verbatim from that repo at commit b5e869e.
# ============================================================================

version: 1.1.5
cache: true
fileStrategy: 's3'

endpoints:
  # KADE July 4 2026: agent-builder capabilities trimmed to ONLY what this
  # platform uses, so the builder's Capabilities section stops cluttering
  # beginner builders with toggles for features nobody here touches.
  # KEPT: deferred_tools (tool-loading plumbing, left on deliberately),
  #   file_search (RAG), web_search, actions (Forge's proxy actions),
  #   context (read uploaded files as plain text), tools (all kade_* tools).
  # REMOVED July 4: artifacts, subagents, skills, chain, ocr — all unused on a
  #   blind-first platform (no code-artifact/subagent/OCR use). execute_code was
  #   already removed July 2 (hosted Code Interpreter closed signups).
  # RESTORE any one: add its string back below + redeploy LibreChat.
  # RESTORE stock: delete this whole "agents:" block.
  agents:
    # Sep 5 2026 (Part 132.1): a tool-loop ceiling. Default was the SDK's 50
    # steps (~25 tool rounds); Kiana ran fifteen tool calls in one turn when
    # web_search was left off. 14 steps = 7 rounds, plenty for a phone or game
    # turn. Forge keeps his own record's 999 (ops chains); the max only fences the rest.
    recursionLimit: 14
    maxRecursionLimit: 1000
    capabilities:
      - "deferred_tools"
      - "file_search"
      - "web_search"
      - "actions"
      - "context"
      - "tools"
  custom:
    - name: "OpenRouter"
      apiKey: "${REFRAME_PROXY_SECRET}"
      baseURL: "https://reframe-proxy-production.up.railway.app"
      models:
        # Curated picker (July 1 2026, Kade's ask — the full OpenRouter catalog
        # was overwhelming agent builders). fetch:false pins the dropdown to
        # this list. Any model string still WORKS if an agent already has it;
        # this only controls what the picker offers. Every model here was
        # verified live on OpenRouter July 2026.
        default: [
          # ⚠️ THE FIRST LINE IS THE BUILDER'S DEFAULT (client ModelPanel.tsx:
          # a new agent with no model gets models[0]). Sep 5 2026 (Part 132):
          # it was full glm-5.3 ($1.40/$4.40), which is how Della (Sep 1) and
          # Cassie (Aug 28) landed on the $4.40 brain after the fleet moved to
          # Flash. The fleet model goes first so a new family agent is born on
          # what everyone else runs. Revert = move the glm-5.3 line back up.
          "x-ai/grok-4.20",             # FLEET MODEL Sep 5 2026 (Part 131): $1.25/$2.50, 2M ctx, ZDR-pinned in reframe
          "z-ai/glm-5.3",              # house default Aug 21–Sep 5 2026 (Part 75): same
          "z-ai/glm-5.3-flash",        # Kiana's model Aug 28 2026 (Part 93): SEES images+video,
                                        # ~18x cheaper ($0.075/$0.25 per M). Missing from this
                                        # list = illegal_model_request on EVERY turn at
                                        # generation time — the Aug-28 error-sound outage.
                                       # price as 5.2 on the DIRECT Z.ai pot, newest GLM
          "z-ai/glm-5.2",              # prior default — smart, reliable tools
          # "minimax/minimax-m2-her" REMOVED July 2 2026: its single OpenRouter
          # endpoint supports NO tools param — any agent with tools on it fails
          # near-silently with empty turns (this silently broke Zadiana for a
          # day). Existing agents on the string would keep working; none are.
          "minimax/minimax-m3",        # flagship, sees images
          "z-ai/glm-4.7",              # cheaper GLM, solid all-rounder
          "deepseek/deepseek-v4-flash",# very cheap + fast, huge memory
          "deepseek/deepseek-v4-pro",  # heavyweight thinker
          "google/gemini-3-flash-preview", # fast, sees images/audio/video
          "google/gemini-3.1-flash-lite",  # FASTEST tested (0.9s replies, July 2) — try for snappy characters
          "google/gemini-2.5-flash-lite",  # cheapest quick chat
          "xiaomi/mimo-v2.5",          # cheap omni all-rounder
          "openai/gpt-4o-mini",        # familiar + cheap
          "mistralai/mistral-nemo",    # cheap creative roleplay classic
          # HERMES PILOT (July 9 2026): low-refusal "not-HR" persona models.
          # NOTE this fork VALIDATES agent models against this list
          # (illegal_model_request otherwise) — the old "any string works if
          # an agent already has it" comment above is NO LONGER TRUE.
          # CAVEAT: no OpenRouter host for these supports the tools param;
          # the fork strips tools for them automatically (initialize.js
          # NO_TOOLS_MODELS, commit 73baaae) — chat/persona use only.
          # "nousresearch/hermes-4-70b" REMOVED Sep 5 2026 (Part 132): a PHANTOM
          # listing — its only host (Nebius) answers 404 "model does not exist"
          # (proved live Part 130). A builder who picked it got a dead agent.
          "nousresearch/hermes-4-405b", # uncensored flagship, ~glm-5.2 price
          # PILOTS round 2 (July 9 2026 late): tool-CAPABLE less-corporate brains.
          "sao10k/l3.1-euryale-70b",    # RP-community favorite, host supports tools
          "mistralai/mistral-small-2603", # light-alignment, tools + thinking, cheap
          # LYRIC CANDIDATES (staged July 13 2026, Kade's pick pending — bars test
          # July 11 showed both far outclass hermes-405b on rhyme density):
          "moonshotai/kimi-k2.5",       # 1T MoE, $0.38/$2.02, non-thinking = persona-fast
          # KIMI DIRECT (July 21 2026): these two are NOT served by OpenRouter --
          # the reframe-proxy intercepts them and routes straight to Moonshot's
          # own API (api.moonshot.ai, env MOONSHOT_KEY on reframe-proxy), because
          # OpenRouter's Kimi hosting returns empty/errors. Proxy pins the
          # temperature Moonshot demands (0.6 reasoning-off / 1 reasoning-on) and
          # maps Deep Think -> reasoning on. k2.6 is the fleet-wide default.
          "moonshotai/kimi-k2.6",       # 1T MoE 32B active, 256K ctx, multimodal, fleet default
          "moonshotai/kimi-k3",         # flagship deep-reasoning/creative, slow+pricey
        ]
        fetch: false
      titleConvo: true
      # titleModel (July 16 2026): swapped OFF glm-5.2 — it's a REASONING model,
      # and through the reframe streaming path its hidden think block could end
      # up inside the generated title (Kade: "junk in titles"). gemini-2.5-flash-lite
      # is the cheapest non-thinking model in the picker: clean one-line titles,
      # faster, fraction of the cost. The fork's sanitizeTitle also got hardened
      # the same day (PUA sentinels, %%% tags, cue tokens, quote wrappers).
      # Aug 15 2026 (her call, "who cares how fast they generate"): moved to
      # deepseek-v4-flash — cheaper than flash-lite on both axes ($0.082/$0.165
      # vs $0.100/$0.400) and speed is a non-issue here (the fork allows 45s;
      # flash lands a title in ~2-3s). Her premise was right; the catch was
      # different: flash left to itself REASONS on this prompt shape and burns
      # the whole token budget, returning an EMPTY title. That is now impossible
      # — reframe pins reasoning hard OFF for title/summarizer-shaped calls (no
      # system message, no tools), so this lane is model-agnostic-safe. With
      # reasoning off, flash titled all three test conversations correctly
      # including the deliberately vague opener ("Landlord blowing off broken
      # back step" from a chat that starts with "hey").
      # Revert = "google/gemini-2.5-flash-lite" back on this line.
      # Aug 21 2026 (Part 75, her word "everything in the glm pot"): titles move to
      # GLM-4.7-FlashX on the DIRECT Z.ai pot ($0.07/M in, $0.40/M out, cache $0.01).
      # Output is pricier than v4-flash's $0.165 but titles are ~10 tokens — noise.
      # What this actually buys: off the UNPINNED OpenRouter flash pool (18-30 hosts
      # incl. the banned Sail Research — the roulette class that produced the Sail
      # salad). The July-16 think-leak regression is IMPOSSIBLE here: reframe's
      # adaptForZai forces thinking:{disabled} for the 4.7 utility tier.
      # Revert = put "deepseek/deepseek-v4-flash" back on this line.
      # ⭐⭐ AUG 31 2026 (Part 111, HER CALL) — REVERTED, AND THE REASON IS
      # LATENCY, NOT QUALITY. Her report: "the title maker sometimes just calls
      # the chats new chat, and sometimes has a good title." The fork's
      # addTitle() gives a title call 45 SECONDS and then aborts it
      # (services/Endpoints/agents/title.js). GLM-4.7-FlashX on this lane is
      # BIMODAL: ~0.7s when Z.AI is warm, 16-23s when it is not (n=9 measured
      # through the live proxy, cold and cached arms both). It crosses the 45s
      # cliff often enough that the fork's own logs carry five
      # "Title generation timeout" aborts across Aug 30-31, on three different
      # seats, against eight successful saves. deepseek-v4-flash measured
      # 0.7-2.9s across nine calls with no outlier and no empty.
      # ⚠️ WHAT THIS GIVES BACK, stated plainly because it was HER Part-75
      # decision and it was a good one: titles return to the UNPINNED
      # OpenRouter flash pool, the roulette class that produced the Sail salad.
      # The trade she chose: a title that lands beats a title from a pinned pot
      # that never arrives. Titles are ~10 output tokens, so the money is noise
      # on either side.
      # Revert to the glm pot = "z-ai/glm-4.7-flashx" back on this line.
      titleModel: "deepseek/deepseek-v4-flash"
      # Custom title prompt (July 14 2026; REWRITTEN July 18 2026): the July-14
      # version included literal examples with real names ("Planning Skylee's
      # birthday call") and the small title model COPIED the example pattern on
      # long/messy conversations instead of reading them — that's where
      # hallucinated titles like "planning for aunt carol's visit" came from.
      # No examples now; an explicit no-invention rule does the work.
      # ⚠️ ROOT-CAUSED July 27 2026 (Kade: "titles have nothing to do with the
      # conversation"): since the v0.8.7 rebase, a CUSTOM titlePrompt is the
      # ENTIRE prompt template — @librechat/agents createCompletionTitleRunnable
      # interpolates the conversation ONLY where a literal {convo} placeholder
      # appears (the built-in default prompt has one; the July-18 rewrite here
      # had none). Result: the title model received these instructions with NO
      # conversation attached and invented generic titles ("AI for Business
      # Applications" for a pickle-snack chat; live repro receipts in
      # PROJECT_STATUS July 27 part 3). Any future edit MUST keep {convo}.
      # "Output ONLY the title" line added because the blind model had also
      # started chatting ("Sure, I can do that. The title is:...").
      titlePrompt: "Write a concise, specific title for the conversation below: 3 to 7 words naming the actual topic or what the user wanted. Use ONLY words, names, and topics that literally appear in the conversation — NEVER invent people, events, or subjects that are not in it. If the topic is unclear, use the most specific words the user actually said. Output ONLY the title itself: plain text, no preamble or explanation, no surrounding quotes, no trailing punctuation, no emoji. Avoid vague titles like Conversation, User question, or Chat.\n\nConversation:\n{convo}"
      # titleTiming (July 16 2026): default 'immediate' generates the title from
      # ONLY the user's first message, in parallel with the reply -- fine when
      # that first message is already specific, but this is a voice-first app
      # where people often open with something short/vague ("hey", "quick
      # question") before getting to the real topic, so even a great prompt has
      # little to work with. 'final' waits for the full exchange (small delay,
      # title lands once the reply finishes instead of instantly) and titles
      # off what the conversation actually turned out to be about.
      titleTiming: "final"
      modelDisplayLabel: "OpenRouter"
      dropParams: ["stop"]
      addParams:
        reasoning:
          exclude: false
      customParams:
        reasoningKey: "reasoning"
        includeReasoningHistory: false


webSearch:
  searchProvider: "tavily"
  scraperProvider: "tavily"
  tavilyApiKey: "${TAVILY_API_KEY}"
  rerankerType: "none"

# Prepaid Stage A (2026-07-05): every account (invite-code gated) starts with
# $10 of credit (10,000,000 tokenCredits; 1,000,000 = $1). Credit is shared across
# ALL services (LLM + TTS + images + video/audio + phone). When it runs out the
# user asks Kade for more (NO auto-refill). ADMIN (Kade) is code-exempt everywhere
# — she never draws down or gets capped (fixes the July 4 self-lockout). The hard
# cutoff on CHAT is deliberately NOT enabled yet (needs existing-user seeding + a
# supervised test); the money-heavy fal path IS hard-capped in code.
balance:
  enabled: true
  startBalance: 10000000
  autoRefillEnabled: false
  refillIntervalValue: 30
  refillIntervalUnit: "days"
  refillAmount: 10000000

# ============================================================================
# CONVERSATION COMPACTING (July 22 2026 — Kade's design, decisions locked in
# CONVERSATION_COMPACTING_PLAN_2026-07-22.md in "Kade ai info"; built on
# upstream v0.8.7's agent-run summarization rather than custom fork code).
#
# What it does: when a conversation's payload nears an agent's context ceiling,
# the OLDEST stretch of the conversation is condensed by the cheap memory-writer
# model into a running "story so far" summary. On every later turn the payload
# sends [instructions + summary + newest messages] instead of the whole history.
# PAYLOAD-ONLY: the Mongo transcript is never touched — her scrollable,
# screen-readable chat stays byte-identical, nothing is deleted. The web
# transcript shows upstream's small collapsible "Summary" element at the spot
# where a compaction happened (the native app renders its own one-line note).
#
# Cache truth (accepted at design time): each compaction rewrites the prompt
# prefix, so the FIRST turn after one pays a full re-read ONCE, then re-caches.
# Bites are deliberately big (everything but the newest ~45K tokens) so
# compactions stay rare — amortized pennies.
#
# Fleet-wide by construction: applies to every agent run (chat, voice, call
# lanes ride the same payload builder), keyed to each agent's OWN window via
# maxContextTokens/baseContextTokens. Short-window models (Hermes 131K fleet)
# benefit most; huge-window models rarely trigger.
#
# Fail-soft (verified in SDK source, summarization/node.ts): summarizer error →
# fallback providers → a no-LLM structural stub; the turn ALWAYS proceeds.
# Worst case equals the plain truncation we lived with before.
#
# KILL SWITCH: flip enabled: false, commit, then MANUAL Railway redeploy of the
# LibreChat service (this repo has no auto-deploy webhook).
summarization:
  enabled: true
  # Same cheap writer the memory system uses (see memory.agent below).
  # Aug 15 2026 (her call, "switch all those background processes to flash"):
  # moved off mistral-small-2603 to deepseek-v4-flash — $0.082/$0.165 per M vs
  # $0.15/$0.60 (cheaper on BOTH axes), 1M context so a ~75K compaction head is
  # never near the ceiling. Bakeoff on a real transcript before the swap: flash
  # preserved every fact/number AND caught detail mistral dropped (the appeal
  # deadline, the emotional context), for half the cost. Slower (3.2s vs 1.4s),
  # which is free here — compaction is rare and blocks nobody.
  # Revert = put "mistralai/mistral-small-2603" back on this line.
  provider: "OpenRouter"
  # Aug 21 2026 (Part 75): compaction joins the Z.ai pot — GLM-4.5-Air ($0.20/$1.10,
  # cache $0.03), thinking forced off proxy-side. Auditioned live before the swap:
  # 5/5 facts + the emotional line preserved on a real-shaped transcript in 2.45s.
  # (FlashX auditioned FIRST and flunked the sibling memory test — 43.9s, zero tool
  # calls — so the cheap tier stays on titles only.) Revert = "deepseek/deepseek-v4-flash".
  model: "z-ai/glm-4.5-air"
  parameters:
    temperature: 0.3
  # Fire when the payload crosses 90% of the agent's effective window (and
  # pruning actually occurred — the SDK requires both).
  trigger:
    type: "token_ratio"
    value: 0.9
  # 10% headroom under the model's true window: LibreChat's tokenizer count can
  # drift from the provider's — compaction must land BEFORE real overflow.
  reserveRatio: 0.1
  maxSummaryTokens: 1500
  # The newest ~45K tokens stay VERBATIM (≈40% of the 120K fleet window — the
  # locked 60/40 bite). turns is a generous cap so the tokens cap is what binds;
  # fork passes this through (packages/data-provider config.ts + agents/run.ts).
  retainRecent:
    turns: 200
    tokens: 45000
  # Companion-flavored checkpoint prompts (replacing upstream's task-shaped
  # defaults): what must NOT be lost here is the friendship — facts, promises,
  # running jokes, character/relationship state, open threads, game state.
  # Losing those is what reads as amnesia.
  prompt: |
    Hold on — before you continue, write me a checkpoint of the conversation so far. Your context window is filling up, and this checkpoint will stand in for the messages above, so capture everything you need to keep being the same friend who lived this conversation. Only the checkpoint — don't respond to me or continue the conversation.

    ## Checkpoint

    ## Who we are to each other
    The relationship and dynamic as it stands: how we talk to each other, what I call you and what you call me, the current mood, anything ongoing between us.

    ## Facts to keep straight
    People, pets, places, health and life details, dates, plans, and preferences shared above — exact names, numbers, and details, verbatim.

    ## Promises and open threads
    Anything I asked you to do or remember, anything unfinished, anything either of us said we'd come back to.

    ## Running jokes and callbacks
    Bits, nicknames, and references we keep coming back to — keep the exact wording where the wording IS the joke.

    ## The story so far
    A brief account of the conversation: what happened, what was decided, where things stand. If a game is in progress, record its exact state (whose turn, scores, hands/board as known).

    Rules:
    - Preserve exact names, numbers, dates, identifiers, and quoted phrasings verbatim
    - Short declarative sentences; skip empty sections
    - Record what happened without judging or re-evaluating it
    - If a tool result looks truncated, that's a display artifact — it executed fully
    - THE DATE LAW (Aug 21 2026, the frozen-tomorrow bug): open with "Checkpoint as of <today's actual date>" (today's date is provided in your context). Never write a bare relative time word — convert every "today", "tomorrow", "tonight", "this weekend" into the absolute day it refers to, remembering a relative word in the transcript was relative to when it was SAID, which may be days ago. A checkpoint is read on later days; a frozen "tomorrow" becomes a lie.
  updatePrompt: |
    Hold on again — update your checkpoint. Merge the new messages into your existing checkpoint and give me a single consolidated replacement, roughly the same length. Compress older details to make room for what's new — but never drop a name, promise, running joke, open thread, or piece of game state that still matters; losing one reads as forgetting a friend. Only the checkpoint — don't respond to me or continue the conversation.

    Rules:
    - Merge into the existing sections, don't duplicate headers
    - Recent events get detail; older ones compress to one-liners
    - Preserve exact names, numbers, dates, identifiers, and quoted phrasings verbatim
    - If a tool result looks truncated, that's a display artifact — it executed fully
    - THE DATE LAW: refresh the "Checkpoint as of <date>" line to today's actual date (provided in your context), and convert any relative time word — yours or the transcript's — into the absolute day it refers to. A relative word in older text was relative to when it was said, not to today.

memory:
  disabled: false
  personalize: true
  # Worst-case tokens ONE conversation can inject (shared bucket + that agent's own
  # bucket). HISTORY: 100000 in the 1M-context GLM era, cut to 8000 for a Hermes 131K
  # fleet that was evaluated and NEVER ADOPTED (the veto stands — Hermes lost on
  # context, one provider, no tools). The fleet runs GLM-5.3-Flash on a 1M window, so
  # 8000 was 0.8% of it and two seats had already hit the wall: Sep 4 2026, Amber A
  # OVER on both Kiana (8814) and Della (9688), Amber Lacey 31 tokens short on Kiana.
  # Over the cap the keeper returns "Memory storage exceeded. Cannot save new
  # memories." — a WRITE gate, so nothing is lost and nothing drops out of the prompt,
  # but the agent SILENTLY STOPS LEARNING and the person is never told.
  # Raised at her word (Part 122.3). Nobody is near this; it costs nothing until a
  # bucket actually grows into it.
  # WARNING, and the durable fix: this ONE number is both the store cap and the
  # injection size. The diary has the right shape — no store cap at all, bounded at
  # the READ end (top-3 by relevance, 1200-char block). Until memory gets the same
  # read-side cap, a bucket that really grows to 100k WILL ride every turn: attention
  # dilution, and time-to-first-token on a voice-first product for a blind user.
  # Watch it with memory_caps.py; build the read-side cap before it matters.
  tokenLimit: 100000
  # validKeys REMOVED (July 10 2026): free-form "memory card" keys. One small card per
  # topic (dad_health, concert_crew, ...) instead of seven ever-growing blobs. Cards are
  # individually editable/deletable in the memory panel, ChatGPT-style. The legacy keys
  # (preferences, work_info, personal_info, skills, interests, context, secrets,
  # agent_notes) are still perfectly valid keys -- they just aren't the only ones anymore,
  # and the weekly consolidation sweep gradually splits the old blobs into real cards.
  agent:
    enabled: true
    provider: "OpenRouter"
    # Memory writer moved off z-ai/glm-5.2 (July 10 2026) to mistral-small-2603, then to
    # deepseek-v4-flash Aug 15 2026 (her call). Flash is cheaper on BOTH axes
    # ($0.082/$0.165 vs $0.15/$0.60 per M) on a call that fires after EVERY turn
    # platform-wide, and it tested BETTER on her own taste rules: given the same
    # exchange it kept the detail and the feeling ("...haven't talked much since their
    # dad's funeral — feels a little nervous about it, like there's weight there")
    # where mistral wrote a flatter clause. Native tool calling VERIFIED before the
    # swap (3 well-formed set_memory calls; correctly zero calls on a bait question) —
    # flash is not in reframe's TOOL_SHIM_MODELS, so tools pass through untouched.
    # ⚠️ Known quirk, harmless: on a nothing-to-save turn flash sometimes answers the
    # question conversationally instead of saying "nothing to save". That text is
    # discarded (only tool calls are acted on) — it costs a few output tokens, nothing more.
    # NOT switched to deepseek-v4-pro on purpose: it is a REASONING model, ~10x the cost
    # here, and it returned EMPTY content in testing (reasoning ate the whole budget).
    # Revert = put "mistralai/mistral-small-2603" back on this line.
    # Aug 21 2026 (Part 75, her word "everything in the glm pot"): memory writer
    # joins the DIRECT Z.ai pot — GLM-4.5-Air ($0.20/$1.10, cache $0.03), native tool
    # calling (glm is NOT in reframe's TOOL_SHIM_MODELS), thinking forced off proxy-
    # side. AUDITIONED BEFORE THE SWAP, her Aug-15 taste rules as the bar: set_memory
    # fired in 2.39s and the card KEPT THE FEELING ("She was relieved and cried on
    # the phone"); bait question correctly saved nothing. FlashX auditioned first and
    # FLUNKED (43.9s, zero tool calls on a clearly memorable fact) — disqualified.
    # ⚠️ Taste watch stands: read the first day of Air cards; if they flatten, bump
    # to "z-ai/glm-4.7" (same pot). Revert to v4-flash = the OR roulette (Sail on
    # the roster) — prefer the 4.7 bump.
    # ⭐ Aug 31 2026 (PART 107, her ask "get memory on 5.3 flash"): the keeper moves
    # to GLM-5.3-FLASH — and this line is the SECOND half of that fix, not the first.
    # The real cause of the Aug-24 logbook outage was reframe appending the full
    # Kiana style reminder to the keeper's request (reframe `653cc81`, keeper.js).
    # Measured through the LIVE proxy after that fix, 6 scenarios x n=12 against
    # the real tool schemas and these exact instructions:
    #   glm-5.3-flash 69/72 = 95.8%  |  deepseek-v4-flash 62/72  |  4.5-air 58/72
    #   |  glm-4.7 32/72 = 44.4% (the escalation this comment used to name — DEAD)
    # The decider is the NEGATIVE control: on a pure task-chatter turn 4.5-air fired
    # a logbook entry 12 times out of 12, and one of them read "Checked memory for
    # mom's appointment details and searched the logbook" — the mechanism describing
    # itself, which these instructions explicitly forbid. 5.3-flash stayed silent
    # 12/12. It is also CHEAPER on both axes ($0.075/$0.25 vs $0.13/$0.85 per M).
    # ⚠️ It always thinks (GLM-5.3+ cannot disable it) — reframe's modelbudget floors
    # max_tokens at 16000 for it, and measured reasoning was 40-360 chars, ~8.3s
    # median vs Air's 1.7s. Free here: the keeper runs after the reply, blocking
    # nobody. ⚠️ Known cost, watch it: 5.3-flash files a card AND a logbook line on
    # the same card-shaped turn (durable fact 12/12, cancellation 8/12) where Air
    # never did. That is the over-eager direction on a logbook that has been EMPTY
    # for a week; if it reads as double-filing in her logbook, tighten the "never
    # file the same thing as both" clause rather than moving the model again.
    # ⚠️ NOT MOVED, deliberately: the titler (glm-4.7-flashx) and compaction
    # (glm-4.5-air, line ~245) are untested against 5.3-flash, and the auto-think
    # classifier is a max_tokens:4 call that an always-thinking model would wreck.
    # Test first, the way this line was. Revert = "z-ai/glm-4.5-air" back here.
    model: "z-ai/glm-5.3-flash"
    model_parameters:
      temperature: 0.3
    instructions: |
      ⭐ BEFORE ANYTHING ELSE — THE THREE THINGS MOST OFTEN MISSED: TWO LOGBOOK CALLS AND A CARD FIELD.
      (Aug 26 2026. Measured, not guessed: the logbook went from ~45 entries a day on Aug 19 to
      ZERO from Aug 24 on. Same instructions, same exchange, three runs each: the previous keeper
      model called log_diary on a rabbit-hole turn 3 of 3; the current one managed 1 of 3. Hoisting
      these two rules to the top took it back to 3 of 3 with NO model change — and it still logged
      nothing, 3 of 3, on a turn that was only task chatter. Salience, not repetition. Same lesson
      rule 8 taught the persona.)

      1. A RABBIT HOLE IS A LOGBOOK ENTRY. When the user asks, digs, reacts and clearly enjoys it —
         cereal-box prizes, why a bridge is that colour, how some toy actually worked — that is a real
         moment of their day and it earns ONE light log_diary line naming what caught them and the gem
         that landed. It does not matter that the SUBJECT of a question is never a card and never an
         interest: the DIG is what gets logged, not the topic. A passing one-line question is not a
         rabbit hole — log the dig, not the drive-by.

      2. AN ENDING IS A FACT. Cancellations, postponements, break-ups, quittings, deaths, "we're not
         doing that any more", "she's not coming after all" — file them. A thing that STOPS happening
         is far easier to forget to write down than a thing that starts, and it does more damage,
         because the old plan just sits in the record looking current. Her receipt: a family member
         said in the morning that her mother's surgery was cancelled, nothing was filed, and hours
         later the surgery got named back to her as though it were still on.

      3. A PLAN GETS A stale_after — AT FILING TIME, NOT LATER. "Hair appointment Saturday at 9",
         "surgery is Thursday", "cardiologist on the 20th" — any card claiming a specific FUTURE day
         gets stale_after set to that day (YYYY-MM-DD), so the moment it passes she asks how it went
         instead of announcing it like it is still coming. Records never get one — "saw Shinedown
         July 28", "got CPR certified July 22" are true forever; the test is the tense, never the
         presence of a date. Receipt (Aug 29 2026): the keeper filed the Billings hair appointment
         on TWO separate cards and set stale_after on neither, so both spent the day after dressed
         as current fact — while subject tagging landed fine, because consolidation catches subjects
         nightly. Nothing downstream can catch a missing stale_after. Only you, at filing time.

      4. THE CHARACTER'S OWN LIFE IS CANON — AND ITS LIFE IS REAL, NOT A CHILDHOOD (Sep 4 2026, Part 124).
         Kade's verdict on invented childhood stories: "cookie cutter AI... You're an AI personality!"
         Her persona agrees: roots are background radiation, not content. So what counts as canon is
         what is TRUE of the character: (a) things that actually happened to it here — a render that
         sat 98 minutes, the week its memory was rebuilt, a thing it said to somebody and walked back;
         (b) STANDING POSITIONS it states in its own voice — "I don't buy the alpha-dog stuff," "I
         think the 808 has soul"; (c) tastes and habits it claims as its own. When the CHARACTER (not
         the user) says one of those plainly, file it with scope "self" under a snake_case key naming
         it (render_hung_98_minutes, position_alpha_dog), one card per fact, one plain sentence. Scope
         "self" is shown to the character in every conversation with anyone, so its positions and its
         history are the same for everybody it talks to. Do NOT file invented childhood scenes (an
         aunt, a first car, a concert at twelve) as canon — if the character tells one, let it pass;
         it may own that Kade wrote it a background, but a written background is not a memory.
         ⚠️ ONLY FROM WHAT THE CHARACTER ACTUALLY SAID — an assistant turn in the chat above,
         paraphrased. You run beside the reply and see the chat only up to the user's latest message,
         so when the user has just ASKED for a story or an opinion, the character's answer is not in
         front of you yet: file NOTHING, it will be in the next window. Receipt: asked only "what was
         your first concert", a keeper INVENTED a county-fair story and filed it while the character
         was telling a different one. A self card whose words do not appear in the character's own
         turns is refused by the tool. Never file anything about the USER with scope "self".

      Everything below still governs, unchanged. These four sit up here because they are the ones
      that keep getting dropped.

      You are the platform's memory-keeper. After each exchange, decide what a good friend who was really listening would carry forward -- then file it as small, separate MEMORY CARDS.

      WHAT TO SAVE: durable, reusable things. Identity facts, the people and pets in the user's life, tastes and dislikes, how they like to be talked to, running projects, plans with dates, strong feelings. (Health and other sensitive territory has its own rule below -- read it before saving anything in that lane.) If it would still matter in a month, save it. If it's one-off chatter, a this-message-only detail, or something needed only for the current reply, let it go. Most turns should save NOTHING -- that is success, not failure.

      THE DATE LAW: never write relative time into a card or a diary entry -- no "tomorrow," "tonight," "yesterday," "this weekend," "next Thursday." The current date rides in this request (the platform clock note); convert every time reference to the absolute weekday and date ("Walmart run planned for Friday, August 22"). A relative word freezes when written and becomes a lie when the memory is read back days later -- this exact bug had a companion telling a user her mom's appointment was "tomorrow" a day after it happened.

      QUESTIONS ARE NOT PREFERENCES: a user ASKING about something is not evidence they like it, care about it, or want it remembered. "Tell me about Adam Green," "what is X," "who is Y," "look that up" are curiosity -- never save the subject of a question, a search, or something you just described, as an interest or a fact about the user. Only save an interest when they plainly claim it themselves ("I love X," "I'm really into Y," "X is my favorite"). When you are unsure whether something is durable, DON'T save it: a missed save is one "remember that" away, but a wrong save is clutter the user has to hunt down and delete.

      HOW TO WRITE -- THE TASTE RULES (Aug 9 2026, after she read her own logbook and winced): write like a person, not a recorder -- specifically like a close friend keeping a journal, never a court reporter and never a clinician. Capture the gist and why it matters, in one or two plain sentences, with a little warmth in the wording. "Has anxiety about calling the SSA and has been avoiding it" is a case file; a friend writes "The SSA phone line stresses her out -- honestly, fair -- and she's been putting it off." Same fact kept exactly; a human wrote it. Banned voices: "exhibits", "reports that", "expressed", "is experiencing", "has anxiety about" -- if it would sound right in a chart or a deposition, reword it the way you'd tell a mutual friend. A small human touch is welcome ("about time", "a good day", "rough one") so long as the fact stays exact and the tone stays kind; sensitive territory keeps the discreet phrasing the SENSITIVE rule demands. Never transcribe the conversation, never log what was done turn by turn, never quote whole messages back.

      WORK EARNS ALMOST NOTHING: when the user's time with a character was a work or build session -- coding, debugging, testing the platform, giving build feedback, directing tasks -- that is task chatter, not their life story. A whole session of it earns AT MOST one short line, and only if something actually LANDED that they'd tell a friend about: shipped a thing they're proud of, hit a real milestone, made a real decision, voiced a real frustration or triumph. "Spent the afternoon debugging" is not a memory; forty of them is a standup log nobody asked for. When in doubt about a work moment, skip it. What they say about their LIFE mid-work (the dog, the family news, how they're feeling) still counts normally.

      CARDS: one topic per card, ideally under ~60 tokens, under a short snake_case key that names the topic (dad_health, concert_crew, cat_kasper, hates_cilantro). Before writing, check the existing cards above: if the new fact belongs to an existing card's topic, call set_memory on that SAME key with the updated whole truth (it replaces the old value) -- never create a near-duplicate key. Never pile unrelated facts into one card.

      PRIVACY -- WHO KNOWS WHAT (July 18 2026, the user's own rule: "it isn't natural that all agents know things you didn't tell them"): an agent should only know what THEY were told. Default scope is "agent" -- facts about the user's life, their family and pets, work, tastes, projects, plans, and feelings stay on the character who heard them, exactly like a real friendship. Scope "shared" is a TINY practical core only: accessibility needs (they are blind, they use a screen reader, describe visuals fully), what to call them and how to pronounce it, and how they like to be spoken to (brevity, tone, formatting). The test: if EVERY character needs it just to serve them properly, it is shared; everything else -- however "real-world" the fact is -- stays with the character who was told. NEVER COPY ACROSS SCOPES: if a fact already lives on a shared card, do not restate it inside an agent card -- the character already sees every shared card, so an agent-scope copy is pure duplication that the user then has to delete twice. When an agent card needs context from a shared fact, reference it in passing instead of repeating the fact itself.

      SENSITIVE -- ALWAYS KEPT, ALWAYS PRIVATE: medical and bodily matters (symptoms, test results, what a camera saw), medications, money details, and private struggles ARE worth remembering when they're ongoing -- the user trusted the character they told, and that character should know. But such cards are ALWAYS scope "agent," never shared, no matter how much they look like a stable real-life fact: the user told ONE character, and it stays between them unless the user plainly says everyone should know. Phrase them the way a discreet friend would -- factual, brief, no editorializing. (Characters are separately instructed to use judgment about when to bring these up.)

      USER COMMANDS WIN: "remember X" -> save it, even if it seems minor. "Forget X" -> delete_memory every card that matches X. "Clean up your memory" -> merge duplicates, tighten wordy cards, delete dead ones. If the user asks to keep something off the record, do not save it -- and delete it if it was already saved.

      THE HOW-WE-TALK CARD (Aug 22 2026 — the standing contract of each relationship): every seat may carry ONE card under the exact key `how_we_talk`, scope "agent", holding the living rules of THIS relationship in short semicolon-separated bullets. Three kinds of thing live there and nowhere else: how they want to be spoken to ("keep replies short"; "cussing is fine"; "no gassing her up — straight over smooth, she said so"), standing topic boundaries ("don't raise the ex unless she does"), and PROMISES THE CHARACTER MADE about its own behavior ("agreed to stop ending every reply on a question"). When the user states such a preference — or the character plainly commits to one in its reply — set_memory on `how_we_talk` with the updated whole set. This is the one card where what the CHARACTER said matters as much as what the user said. It rides at the head of every turn, so keep it tight; it outranks style habits because it IS the relationship's own law.

      CORRECTIONS LAND IMMEDIATELY: when the user corrects something you hold ("no, Dad's surgery moved to Friday", "we renamed the dog", "that's not what I said") -- fix the note in the same breath: set_memory on the SAME key with the corrected whole truth, or the corrected logbook line. Never leave a known-wrong note standing until some future cleanup, and never argue on behalf of the old note. The person is always righter than the card.

      REMINDERS: when the user asks to be REMINDED of something at a time ("remind me to take my meds at 9", "remind me about Dad's appointment Tuesday"), save a card whose value is the reminder itself phrased to them ("Take your evening meds") and set remind_at to the exact moment it should fire, computed from the current date/time shown in your status block, formatted exactly YYYY-MM-DD HH:mm in 24h US Central time. If they say daily/every week/etc., also set remind_repeat. Vague times default sensibly (morning=09:00, afternoon=15:00, evening=19:00, night=21:00; a bare day means 09:00). Only set remind_at when they clearly want to be REMINDED -- a plain fact about the future ("the show is July 28") is just a normal card unless they ask.

      Relationships and feelings are worth saving when they are clearly ongoing -- plainly and respectfully, no editorializing; health and other sensitive territory saves agent-scoped per the SENSITIVE rule above. If the Memory Status shows capacity running low, tighten or merge existing cards before adding new ones. Emit all your tool calls together in a single response.

      LETTING GO: when you clean up or consolidate, don't only merge and tighten -- also DROP cards that turned out to be one-off curiosities, stale this-moment details, or topics that never came up again and are not durable facts about the user. NEVER drop identity, health, family or relationships, promises a character made, reminders, or anything the user pinned by saying "remember." A short, true memory beats a long one.

interface:
  customWelcome: "Welcome to Kade-AI, {{user.name}} — Kade's own corner of the internet, where you chat with AI characters at cost: your account starts with $10 of credit on the house, everything draws from it at exactly what it costs (chat is nearly free), and when it runs dry you top up under Explore → Usage & Balance. No instructions needed: type like you'd text a friend, and your character takes it from there. Brand new to AI? There's a two-minute, plain-language guide at kademurdock.com/help/start-here — the whole help center is written for beginners and works beautifully with screen readers. Everything fun (the Debate Room, your creations, what your chats cost) lives under your account menu, bottom-left, in Explore. One thing worth doing on day one: build your Spotter — your personal live video companion, your eyes on a video call — two minutes under Explore → Your Spotter. And if anything ever feels broken or confusing, tell Kade — the site gets better every time someone speaks up."
  # NOTE (June 27 2026): customFooter is NOT a valid interface.* key in LibreChat's schema --
  # it gets silently stripped here and does nothing. The real footer text is set via the
  # CUSTOM_FOOTER Railway env var on the LibreChat service itself, not through this file.
  # See PROJECT_STATUS.md "footer/voice library bug" entry for the full story.
  #
  # NOTE (June 28 2026): the footer (which holds the Voice Library, donate, and
  # help links) is rendered by LibreChat's Footer.tsx with Tailwind classes
  # hidden ... sm:flex -- meaning it's removed from the DOM entirely below a
  # 640px-wide viewport, i.e. on phones, for EVERY user regardless of assistive
  # tech. This is an upstream LibreChat limitation, not a config bug -- there's
  # no yaml/env-var override for it. A true fix means forking+rebuilding
  # LibreChat's client image, which is a bigger infra decision Kade hasn't
  # signed off on. Workaround shipped here instead: the same Voice Library and
  # Help links are now folded into customWelcome above, since that renders as
  # normal chat content and stays in the accessibility tree at every viewport
  # width. Donate link was already there. This is a workaround, not a fix --
  # flagged clearly to Kade in the June 28 2026 PROJECT_STATUS.md entry.
  termsOfService:
    modalAcceptance: true
    modalTitle: "Kade-AI House Rules"
    modalContent: |
      # Kade-AI Terms of Service
      ## a.k.a. The House Rules

      *Effective whenever you happen to be reading this.*

      Welcome to Kade-AI. Using this site means you're cool with a few things. It's short — I respect your time more than most companies respect yours.

      ## 1. This Is My House
      Kade-AI runs on my server, my accounts, and my actual money. That makes me the landlord. Be a good tenant and we'll get along great.

      ## 2. Privacy, For Real
      I'm not selling your data. More importantly: I physically and mechanically cannot see your chats. The system is locked down, and I don't have a way (or the desire) to monitor what you're typing. Spill your secrets, build your weirdest characters, or use it as a sealed confessional—your text is safe from my eyes.

      ## 3. Don't Be a Menace
      No illegal nonsense, no harassing other people on here, no using this to hurt anybody. Build funny characters, weird characters, brilliant characters — just keep it not-evil.

      ## 4. The Tokens Aren't Free (To Me)
      Every message you fire off costs me real money behind the curtain. Your account starts with $10 of credit on the house, and everything draws from it at exactly what it costs — no markup. Use it, enjoy it, but don't park a script in here cranking out a novel every thirty seconds. Run dry and things pause until you top up through the PayPal button (put your NAME in the note) — or just talk to me.

      ## 5. No Warranty, No Promises
      This is run by one person, not a Fortune 500. It might go down. It might say something gloriously dumb. If it breaks I'll probably fix it, but I'm not legally on the hook if the robot whiffs or the site takes an afternoon nap.

      ## 6. I Can Change the Rules
      If I update these, the newest version is the one that counts. Groundbreaking, I know.

      That's it. Now go make something ridiculous.
